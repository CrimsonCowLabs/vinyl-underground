# Vinyl Underground, served over HTTPS on a tailnet by `tailscale serve`.
# Host setup: README.md at the repo root. Stack runbook: deploy/README.md.
#
# Every setting has a default, so `docker compose up -d` works with no .env at
# all. To change one, copy .env.example to .env (gitignored) and uncomment it.
# This file holds no personal values.

name: vinyl-underground

x-run-as: &run-as "${VU_UID:-1000}:${VU_GID:-1000}"
x-data-volume: &data-volume "${VU_DATA_DIR:-./data}:/data"
# The Inbox, where new music lands before it joins the Library. Writable, and
# kept apart from /data.
x-inbox-volume: &inbox-volume "${VU_INBOX_DIR:-./inbox}:/inbox"

services:
  # One-shot: Docker creates a missing bind-mount folder as root, which the app
  # (not root) can't write to. Hand the data and Inbox folders to the app's
  # user first.
  data-permissions:
    image: busybox:1.37
    user: "0:0"
    network_mode: none
    environment:
      OWNER: *run-as
    command:
      - sh
      - -c
      - >-
        set -e;
        [ "$$(stat -c %u:%g /data)" = "$$OWNER" ] || chown -R "$$OWNER" /data;
        [ "$$(stat -c %u:%g /inbox)" = "$$OWNER" ] || chown -R "$$OWNER" /inbox
    volumes:
      - *data-volume
      - *inbox-volume

  vinyl-underground:
    # The published image when VU_IMAGE is set in .env
    # (ghcr.io/crimsoncowlabs/vinyl-underground:<version>, then `docker compose pull`).
    # Unset, `docker compose up -d --build` builds this checkout as vinyl-underground:local.
    image: ${VU_IMAGE:-vinyl-underground:local}
    build:
      context: ..
    container_name: vinyl-underground
    restart: unless-stopped
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    user: *run-as
    # Bound to loopback only: `tailscale serve` on the host is the sole way in,
    # and it adds the HTTPS the PWA's service worker needs.
    ports:
      - "127.0.0.1:${VU_PORT:-4533}:4533"
    # Any ND_* setting in .env reaches the app (see .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      # Defaults that differ from upstream Navidrome; .env can still override them.
      # Rescan on a schedule too: the file watcher can miss changes on network mounts.
      ND_SCANNER_SCHEDULE: ${ND_SCANNER_SCHEDULE:-@every 24h}
      ND_BACKUP_PATH: ${ND_BACKUP_PATH:-/data/backup}
    volumes:
      - *data-volume
      # Scanned as a second library that only the admin sees (ND_INBOX_PATH,
      # /inbox in the image).
      - *inbox-volume
      # The Library, read-only unless VU_LIBRARY_MODE=rw. Editing the Library's
      # Files needs it read-write, on the host too (ADR-0011); the app checks at
      # startup by trying a write, and editing is off without one.
      # docker-compose.promote.yml binds /music/Vinyl Underground read-write for
      # Promote (ADR-0008).
      - "${VU_LIBRARY_DIR:-/mnt/music}:/music:${VU_LIBRARY_MODE:-ro}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional: the LLM for Generated Playlists on this same host, CPU-only.
  # Off unless started with `--profile ollama`. Then set in .env:
  #   ND_LLM_BASEURL=http://ollama:11434
  #   ND_LLM_MODEL=qwen3.5:4b-q4_K_M
  # and pull the model once (deploy/README.md, "Generated Playlists").
  # The reference setup runs Ollama on another machine instead.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.40.16
    container_name: vinyl-underground-ollama
    restart: unless-stopped
    # Not published: only the app reaches it, over the compose network.
    environment:
      # Keep the model loaded between requests; loading it takes a while.
      OLLAMA_KEEP_ALIVE: ${VU_OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - "${VU_OLLAMA_DIR:-./ollama}:/root/.ollama"
