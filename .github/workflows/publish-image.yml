# Publishes the multi-arch (amd64 + arm64) image to GHCR on each version tag.
# Run it by hand (workflow_dispatch) to build both platforms without pushing.
# Releasing, and the one-time step that makes the package public: docs/releasing.md.

name: Publish image

on:
  push:
    # A semver tag: v0.1.0, v1.2.0-rc.1.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/crimsoncowlabs/vinyl-underground
  # Put the labels and descriptions on the multi-arch index too, not just each
  # platform's manifest, so GHCR shows them and links the package to the repo.
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, for `git describe` on a dry run.
          fetch-depth: 0

      # The version baked into the binary, through the same GIT_TAG and GIT_SHA
      # build args as `make docker-image`. A release gets its own tag; a dry run
      # gets the Makefile's value, the last tag plus -SNAPSHOT.
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            GIT_TAG="$GITHUB_REF_NAME"
          else
            GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)-SNAPSHOT"
          fi
          {
            echo "git_tag=$GIT_TAG"
            echo "git_sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest only for a stable tag: metadata-action leaves it off
          # prereleases (v1.2.0-rc.1).
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=Vinyl Underground
            org.opencontainers.image.description=Self-hosted music server for private networks, a hard fork of Navidrome
            org.opencontainers.image.licenses=GPL-3.0-only
          annotations: |
            org.opencontainers.image.title=Vinyl Underground
            org.opencontainers.image.description=Self-hosted music server for private networks, a hard fork of Navidrome
            org.opencontainers.image.licenses=GPL-3.0-only

      # The Go binary, UI and mpv stubs are cross-compiled on the runner's own
      # platform (Dockerfile stages pinned to $BUILDPLATFORM), so emulation only
      # runs the final stage's `apk add` and checks.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GIT_SHA=${{ steps.version.outputs.git_sha }}
            GIT_TAG=${{ steps.version.outputs.git_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A fresh pull of the release starts on both platforms.
      - name: Smoke-test the pushed image
        if: github.event_name == 'push'
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --pull always --platform "$platform" "$REF" --version
          done
